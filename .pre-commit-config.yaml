# Same linters, versions and paths as `make lint` / CI: black, isort and
# flake8 on cats/ and tests/ only (mypy runs in `make lint`). The size check
# runs on every staged file, like its CI counterpart (`large-files` job).
repos:
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        args: [--line-length=120]
        files: ^(cats|tests)/

  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]
        files: ^(cats|tests)/

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=120, "--extend-ignore=E203,W503"]
        files: ^(cats|tests)/

  # Refuses staged files over 2 MiB: large blobs stay in git history for good.
  # See scripts/check_large_files.py.
  - repo: local
    hooks:
      - id: check-large-files
        name: refuse files over 2 MiB
        entry: python scripts/check_large_files.py
        language: python
