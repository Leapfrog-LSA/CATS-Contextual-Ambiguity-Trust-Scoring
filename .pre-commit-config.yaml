# Same linters, versions and paths as `make lint` / CI: black, isort and
# flake8 on cats/ and tests/ only (mypy runs in `make lint`).
files: ^(cats|tests)/
repos:
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        args: [--line-length=120]

  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=120, "--extend-ignore=E203,W503"]
