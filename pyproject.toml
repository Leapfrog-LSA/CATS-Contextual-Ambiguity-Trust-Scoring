[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cats-scoring"
version = "1.6.0"
description = "Contextual Ambiguity & Trust Scoring — trust intelligence for OSINT sources"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Leapfrog-LSA"}]
keywords = ["osint", "trust-scoring", "source-reliability", "disinformation", "misinformation", "gdpr", "eu-ai-act", "nlp", "fact-checking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Core dependencies of the library surface (cats.lite + cats.calibration).
# The API deployment stack (FastAPI, SQLAlchemy, Redis, …) stays in
# requirements.txt — install it only for the full service.
dependencies = [
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "spacy>=3.7,<4.0",
    "textblob>=0.18,<1.0",
    "structlog>=24.1,<25.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
sbert = ["sentence-transformers>=2.7,<4.0"]
bert = ["transformers>=4.40,<5.0", "torch>=2.2,<3.0"]

[project.urls]
Homepage = "https://github.com/Leapfrog-LSA/CATS-Contextual-Ambiguity-Trust-Scoring"
Documentation = "https://github.com/Leapfrog-LSA/CATS-Contextual-Ambiguity-Trust-Scoring/tree/main/docs"
Changelog = "https://github.com/Leapfrog-LSA/CATS-Contextual-Ambiguity-Trust-Scoring/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["cats*"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
