services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      # - "443:443"   # enable with TLS (see deploy/nginx.conf)
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/certs:/etc/nginx/certs:ro   # mount certs for TLS
    depends_on:
      - app

  app:
    build: .
    # Reachable only via nginx (expose = container network only). Publishing
    # 8000 on the host would let clients bypass the proxy's rate limiting,
    # security headers and X-Forwarded-For rewrite.
    expose:
      - "8000"
    env_file: .env
    environment:
      # nginx below overwrites X-Forwarded-For with the real client address, so
      # the app may trust it here. The code default is off (threat model T3):
      # without a proxy that rewrites the header, any client could forge it.
      TRUST_PROXY_HEADERS: "true"
      # uvicorn worker processes (default 1 in the image). Each one loads the
      # spaCy model, ~1.1 GB of RAM, and adds about one NLP thread of capacity
      # (docs/load_test_2026-09.md). Set WEB_CONCURRENCY in .env to resize.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cats
      # Set POSTGRES_PASSWORD in .env for any real deployment (and use the same
      # value in DATABASE_URL). The fallback is for local development only.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cats}
      POSTGRES_DB: cats
    ports:
      # Loopback only (threat model T2): reachable from this host for local
      # tests and tools, never from outside. The app reaches it as `postgres`
      # on the compose network either way.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cats"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # With REDIS_PASSWORD set, Redis requires it (then REDIS_URL must be
    # redis://:<password>@redis:6379/0). Unset, it runs without auth, which is
    # acceptable only because the port is loopback-bound below.
    command: ["sh", "-c", 'exec redis-server $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}']
    ports:
      # Loopback only (threat model T2), as for Postgres.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli $${REDIS_PASSWORD:+-a "$$REDIS_PASSWORD" --no-auth-warning} ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
