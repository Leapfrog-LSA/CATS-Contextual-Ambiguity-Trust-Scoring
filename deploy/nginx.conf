# CATS reverse proxy.
# Mounted at /etc/nginx/conf.d/default.conf (included inside the http{} block).
#
# Provides: rate limiting (30 req/min/IP, matching the in-app Redis limiter),
# security headers, and correct X-Forwarded-For so the app sees the real client
# IP (cats.core.security.get_client_ip reads it).
#
# X-Forwarded-For is OVERWRITTEN with $remote_addr, never appended to
# ($proxy_add_x_forwarded_for): the app takes the first entry of the header
# and that value lands in the GDPR audit log, so a client-supplied header
# would let callers forge the recorded IP.

# 30 requests/minute per client IP; 10MB keeps state for ~160k IPs.
limit_req_zone $binary_remote_addr zone=cats_limit:10m rate=30r/m;

upstream cats_app {
    server app:8000;
    keepalive 32;
}

# Shared proxy + security configuration.
# (Repeated per server below; kept inline for a single self-contained file.)

server {
    listen 80;
    server_name _;

    # Rate limit: allow short bursts, reject the rest with 429.
    limit_req zone=cats_limit burst=10 nodelay;
    limit_req_status 429;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://cats_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # /metrics is unauthenticated (request counts, latency, score and band
    # distribution), so the public proxy does not serve it. Prometheus scrapes
    # the app directly on the internal network instead: http://app:8000/metrics
    # (the app port is `expose`d to the compose network, never published).
    #
    # Deliberately NOT an allow-list of private ranges such as 172.16.0.0/12.
    # Behind Docker's userland proxy, an external client can reach nginx with
    # the bridge gateway (172.x.0.1) as $remote_addr, so a private-range allow
    # would expose /metrics to everyone. To serve it here for a specific
    # scraper, add `allow <scraper IP>;` above `deny all;` and proxy_pass it.
    location = /metrics {
        deny all;
    }
}

