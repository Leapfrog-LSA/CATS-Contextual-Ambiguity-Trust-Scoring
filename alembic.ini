[alembic]
script_location = alembic
# Put the working directory on sys.path so env.py can import `cats` when the
# package is not installed (the Docker image copies it to /app, no pip install).
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://cats:cats@localhost:5432/cats

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
